<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>JSME embebido</title>
  <script src="https://cdn.jsdelivr.net/npm/jsme-editor@2024.4.29/jsme.nocache.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #11161f;
      font-family: Arial, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    #wrapper {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    #jsme_container {
      flex: 1;
      min-height: 240px;
      border-radius: 10px;
      overflow: hidden;
      background: white;
      border: 1px solid #3a4151;
    }
  </style>
  <script>
    let jsmeApplet = null;
    let resizeTimer = null;

    function createEditor(smilesToRestore = "") {
      const el = document.getElementById("jsme_container");
      if (!el) return;

      const w = el.clientWidth;
      const h = el.clientHeight;

      if (w < 50 || h < 50) {
        setTimeout(() => createEditor(smilesToRestore), 60);
        return;
      }

      try {
        el.innerHTML = "";
        jsmeApplet = new JSApplet.JSME("jsme_container", `${w}px`, `${h}px`, {
          options: "oldlook,star,nocanonize"
        });

        if (smilesToRestore) {
          try {
            jsmeApplet.readGenericMolecularInput(smilesToRestore);
          } catch (_) {}
        }
      } catch (_) {}
    }

    function jsmeOnLoad() {
      setTimeout(() => createEditor(""), 0);
    }

    window.getCurrentSmiles = function() {
      try {
        if (!jsmeApplet) return "";
        return jsmeApplet.smiles();
      } catch (_) {
        return "";
      }
    };

    window.clearEditor = function() {
      try {
        if (!jsmeApplet) return;
        if (typeof jsmeApplet.reset === "function") {
          jsmeApplet.reset();
          return;
        }
      } catch (_) {}

      try {
        if (!jsmeApplet) return;
        if (typeof jsmeApplet.readMolecule === "function") {
          jsmeApplet.readMolecule("");
          return;
        }
      } catch (_) {}

      try {
        if (!jsmeApplet) return;
        if (typeof jsmeApplet.readGenericMolecularInput === "function") {
          jsmeApplet.readGenericMolecularInput("");
          if (!window.getCurrentSmiles()) return;
        }
      } catch (_) {}

      try {
        createEditor("");
      } catch (_) {}
    };

    window.forceEditorRelayout = function() {
      try {
        const smiles = (jsmeApplet && jsmeApplet.smiles) ? jsmeApplet.smiles() : "";
        createEditor(smiles);
      } catch (_) {
        createEditor("");
      }
    };

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.forceEditorRelayout) {
          window.forceEditorRelayout();
        }
      }, 80);
    });
  </script>
</head>
<body>
  <div id="wrapper">
    <div id="jsme_container"></div>
  </div>
</body>
</html>
